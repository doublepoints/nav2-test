# my_sim_tesi_bringup/config/livox_to_laserscan.yaml
pointcloud_to_laserscan_node:
  ros__parameters:
    # 完全不设置target_frame参数，直接在原始坐标系中转换
    transform_tolerance: 0.01
    min_height: -0.5  # 允许检测下方的点
    max_height: 1.0
    angle_min: -3.14159  # -180度
    angle_max: 3.14159   # 180度
    angle_increment: 0.0044  # 0.25度，提高角度分辨率
    scan_time: 0.033  # 30Hz
    range_min: 0.2
    range_max: 20.0
    use_inf: true
    inf_epsilon: 1.0
    use_sim_time: true
    # 增加队列大小以避免丢弃消息
    queue_size: 50